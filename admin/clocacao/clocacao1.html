<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Contratos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f0f0f0;
    color:#111;
    padding:20px;
}

.dark{
    background:#1e1e1e;
    color:white;
}

.container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.left,
.right{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.dark .left,
.dark .right{
    background:#2d2d2d;
}

.left{
    flex:1;
    min-width:350px;
}

.right{
    width:450px;
}

h1{
    margin-bottom:20px;
}

.section{
    margin-bottom:20px;
}

.section h2{
    margin-bottom:10px;
    font-size:18px;
}

input,
button,
textarea,
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}

.dark input,
.dark textarea,
.dark select{
    background:#3b3b3b;
    color:white;
    border:1px solid #555;
}

button{
    cursor:pointer;
    border:none;
    background:#007bff;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

.table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

.table th,
.table td{
    border:1px solid #ccc;
    padding:8px;
    text-align:left;
}

.dark .table th,
.dark .table td{
    border:1px solid #555;
}

.preview{
    width:100%;
    height:600px;
    resize:none;
    font-family:Courier New;
}

.row{
    display:flex;
    gap:10px;
}

.checkbox-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

@media(max-width:1000px){

    .container{
        flex-direction:column;
    }

    .right{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="container">

<div class="left">

<h1>SISTEMA DE CONTRATOS</h1>

<div class="section">

<h2>CLIENTE</h2>

<input type="text" id="cliente" placeholder="Nome do cliente">

</div>

<div class="section">

<h2>NOME DA ARRUMAÇÃO</h2>

<input type="text" id="arrumacao">

</div>

<div class="section">

<h2>CATEGORIAS</h2>

<div class="checkbox-group">

<label>
<input type="checkbox" id="cat_arr" checked>
Arrumação
</label>

<label>
<input type="checkbox" id="cat_cadeiras" checked>
Cadeiras
</label>

<label>
<input type="checkbox" id="cat_mesas" checked>
Mesas
</label>

<label>
<input type="checkbox" id="cat_kids" checked>
Área Kids
</label>

</div>

</div>

<div class="section">

<h2>ITENS DA ARRUMAÇÃO</h2>

<div class="row">

<input type="number" id="qtd" placeholder="Qtd">

<input type="text" id="item" placeholder="Item">

<input type="number" id="valor" placeholder="Valor">

<button onclick="adicionarItem()">
Adicionar
</button>

</div>

<table class="table">

<thead>

<tr>
<th>Qtd</th>
<th>Item</th>
<th>Valor</th>
</tr>

</thead>

<tbody id="tabela_items">

</tbody>

</table>

</div>

<div class="section">

<h2>CADEIRAS E MESAS</h2>

<label>
<input type="checkbox" id="usar_cadeiras">
Cadeiras
</label>

<div class="row">

<input type="number" id="qtd_cadeiras" placeholder="Qtd">

<input type="number" id="preco_cadeiras" placeholder="Preço">

</div>

<br>

<label>
<input type="checkbox" id="usar_mesas">
Mesas
</label>

<div class="row">

<input type="number" id="qtd_mesas" placeholder="Qtd">

<input type="number" id="preco_mesas" placeholder="Preço">

</div>

</div>

<div class="section">

<h2>ÁREA KIDS</h2>

<div class="checkbox-group">

<label>
<input type="checkbox" class="kids" data-nome="Pula Pula" data-valor="150">
Pula Pula - R$150
</label>

<label>
<input type="checkbox" class="kids" data-nome="Piscina de Bolinhas" data-valor="120">
Piscina de Bolinhas - R$120
</label>

<label>
<input type="checkbox" class="kids" data-nome="Escorrega" data-valor="100">
Escorrega - R$100
</label>

<label>
<input type="checkbox" class="kids" data-nome="Cama Elástica" data-valor="180">
Cama Elástica - R$180
</label>

</div>

</div>

<div class="section">

<h2>CONFIGURAÇÕES</h2>

<select id="tema">

<option value="claro">
Claro
</option>

<option value="escuro">
Escuro
</option>

</select>

<button onclick="salvarTema()">
Salvar Tema
</button>

</div>

<div class="section">

<button onclick="gerarContrato()">
Gerar Contrato
</button>

<br><br>

<button onclick="baixarPDF()">
Gerar PDF
</button>

</div>

</div>

<div class="right">

<h2>PREVIEW DO CONTRATO</h2>

<textarea id="preview" class="preview"></textarea>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let listaItems = [];

function adicionarItem(){

    const qtd = document.getElementById("qtd").value;
    const item = document.getElementById("item").value;
    const valor = document.getElementById("valor").value;

    if(qtd === "" || item === "" || valor === ""){

        alert("Preencha todos os campos.");
        return;

    }

    listaItems.push({
        qtd:parseInt(qtd),
        item:item,
        valor:parseFloat(valor)
    });

    atualizarTabela();

    document.getElementById("qtd").value = "";
    document.getElementById("item").value = "";
    document.getElementById("valor").value = "";

}

function atualizarTabela(){

    const tabela = document.getElementById("tabela_items");

    tabela.innerHTML = "";

    listaItems.forEach(i=>{

        tabela.innerHTML += `
        <tr>
            <td>${i.qtd}</td>
            <td>${i.item}</td>
            <td>R$ ${i.valor.toFixed(2)}</td>
        </tr>
        `;

    });

}

function gerarContrato(){

    const cliente = document.getElementById("cliente").value;
    const arrumacao = document.getElementById("arrumacao").value;

    if(cliente === ""){

        alert("Digite o nome do cliente.");
        return;

    }

    let texto = "";

    let total = 0;

    texto += "VALOR DE RESSARCIMENTO DOS ITENS LOCADOS\n\n";

    texto += `CLIENTE: ${cliente}\n`;
    texto += `ARRUMAÇÃO: ${arrumacao}\n`;

    texto += `DATA: ${new Date().toLocaleDateString()}\n\n`;

    texto += "--------------------------------------------------\n";

    if(document.getElementById("cat_arr").checked){

        texto += "\n[ ARRUMAÇÃO ]\n";

        listaItems.forEach(i=>{

            const subtotal = i.qtd * i.valor;

            total += subtotal;

            texto += `${i.qtd}x ${i.item} - R$ ${subtotal.toFixed(2)}\n`;

        });

    }

    if(document.getElementById("cat_cadeiras").checked){

        if(document.getElementById("usar_cadeiras").checked){

            const qtd = parseInt(
                document.getElementById("qtd_cadeiras").value || 0
            );

            const preco = parseFloat(
                document.getElementById("preco_cadeiras").value || 0
            );

            const subtotal = qtd * preco;

            total += subtotal;

            texto += `\n${qtd}x Cadeiras - R$ ${subtotal.toFixed(2)}\n`;

        }

    }

    if(document.getElementById("cat_mesas").checked){

        if(document.getElementById("usar_mesas").checked){

            const qtd = parseInt(
                document.getElementById("qtd_mesas").value || 0
            );

            const preco = parseFloat(
                document.getElementById("preco_mesas").value || 0
            );

            const subtotal = qtd * preco;

            total += subtotal;

            texto += `${qtd}x Mesas - R$ ${subtotal.toFixed(2)}\n`;

        }

    }

    if(document.getElementById("cat_kids").checked){

        texto += "\n[ ÁREA KIDS ]\n";

        document.querySelectorAll(".kids").forEach(k=>{

            if(k.checked){

                const nome = k.dataset.nome;
                const valor = parseFloat(k.dataset.valor);

                total += valor;

                texto += `${nome} - R$ ${valor.toFixed(2)}\n`;

            }

        });

    }

    texto += "\n";

    texto += `TOTAL: R$ ${total.toFixed(2)}\n\n`;

    texto += "ESSES VALORES SERÃO COBRADOS EM CASO DE DANOS.\n\n";

    texto += "Locatário: ______________________\n\n";
    texto += "Locador: ________________________\n";

    document.getElementById("preview").value = texto;

}

async function baixarPDF(){

    gerarContrato();

    const texto = document.getElementById("preview").value;

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const linhas = doc.splitTextToSize(texto, 180);

    doc.text(linhas, 10, 10);

    doc.save("contrato.pdf");

}

function salvarTema(){

    const tema = document.getElementById("tema").value;

    localStorage.setItem("tema", tema);

    aplicarTema();

}

function aplicarTema(){

    const tema = localStorage.getItem("tema") || "claro";

    document.getElementById("tema").value = tema;

    if(tema === "escuro"){

        document.body.classList.add("dark");

    }else{

        document.body.classList.remove("dark");

    }

}

aplicarTema();

</script>

</body>
</html>

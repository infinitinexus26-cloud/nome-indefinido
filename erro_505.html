<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>505 - Manutenção</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #0a0f1f, #111827);
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .box {
        text-align: center;
        padding: 40px;
        border-radius: 16px;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.08);
        max-width: 480px;
        width: 90%;
    }

    .erro {
        font-size: 14px;
        letter-spacing: 4px;
        color: #9ca3af;
        margin-bottom: 5px;
    }

    .code {
        font-size: 90px;
        font-weight: 700;
        color: #f59e0b;
        margin-bottom: 10px;
    }

    .title {
        font-size: 26px;
        margin-bottom: 10px;
    }

    .desc {
        font-size: 15px;
        color: #9ca3af;
        margin-bottom: 25px;
    }

    .divider {
        width: 60px;
        height: 3px;
        background: #f59e0b;
        margin: 20px auto;
        border-radius: 10px;
    }

    .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        background: #f59e0b;
        color: #111827;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn:hover {
        background: #d97706;
    }

    footer {
        margin-top: 25px;
        font-size: 12px;
        color: #6b7280;
    }
</style>
</head>
<script>
        window.addEventListener('load', function() {
            const isOnline = localStorage.getItem('siteOnline') !== 'false'; // Default to true if not set
            if (!isOnline) {
                window.location.href = 'erro_505.html';
</script>
<body>

<div class="box">
    <div class="erro">ERRO</div>
    <div class="code">505</div>

    <div class="title">Site em manutenção</div>

    <div class="divider"></div>

    <div class="desc">
        Estamos realizando ajustes para melhorar o sistema.<br>
        Tente acessar novamente em alguns minutos.
    </div>

    <a href="https://infinitinexus26-cloud.github.io/nome-indefinido/" class="btn">Recarregar página</a>

    <footer>
        Serviço temporariamente indisponível
    </footer>
</div>

</body>
</html>
